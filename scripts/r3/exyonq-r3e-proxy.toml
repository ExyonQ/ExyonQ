# R3E host-native P4 proxy config (measurement only).
# Placeholders replaced by r3e-competitive-remote.sh
config_version = 2

[[server]]
listen = "0.0.0.0:__EXYONQ_PORT__"
routes = ["api"]

[[route]]
name = "api"
match = { path = "/api" }
upstream = "backend"

[[upstream]]
name = "backend"
target = "http://127.0.0.1:__UPSTREAM_PORT__"
timeout_ms = 5000
