[package]
name = "exyonq-mod-http3"
description = "HTTP/3 / QUIC runtime facade — Quinn legacy interim; s2n/quiche providers (P13D)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# P13D Phase 6R: default s2n. Quinn exclusive with modern providers (compile_error).
default = ["http3-provider-s2n"]
http3-provider-quinn-legacy = ["dep:h3", "dep:h3-quinn", "dep:quinn", "dep:quinn-proto"]
http3-provider-s2n = ["dep:exyonq-http3-provider-s2n", "dep:exyonq-http3-provider-api"]
http3-provider-quiche = ["dep:exyonq-http3-provider-quiche", "dep:exyonq-http3-provider-api"]
# Aliases kept during P13P→P13D transition
provider-quinn = ["http3-provider-quinn-legacy"]
provider-quiche = ["http3-provider-quiche"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
exyonq-module-api = { path = "../../module-api" }
exyonq-mod-tls = { path = "../exyonq-mod-tls" }
exyonq-http3-provider-api = { path = "../exyonq-http3-provider-api", optional = true }
exyonq-http3-provider-s2n = { path = "../exyonq-http3-provider-s2n", optional = true }
exyonq-http3-provider-quiche = { path = "../exyonq-http3-provider-quiche", optional = true }
http.workspace = true
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"], optional = true }
quinn-proto = { version = "0.11.15", optional = true }
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
