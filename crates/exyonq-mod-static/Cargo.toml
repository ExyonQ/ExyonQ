[package]
name = "exyonq-mod-static"
description = "KD2 static file module — path resolution, preload, wire/sendfile assets"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-utils = ["exyonq-module-api/test-utils"]

[dependencies]
bytes.workspace = true
brotli.workspace = true
flate2.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
memmap2.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
exyonq-cache = { workspace = true }
exyonq-module-api = { path = "../../module-api" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
