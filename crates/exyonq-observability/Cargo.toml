[package]
name = "exyonq-observability"
description = "Cap061 — production observability leaf (sinks, subscriber, redaction, OTel)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["file"]
file = ["dep:tracing-appender"]
syslog = ["dep:syslog"]
journald = []
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
]
# Product CLI default on Unix: file + syslog + journald + otel.
full = ["file", "syslog", "journald", "otel"]

[dependencies]
anyhow.workspace = true
exyonq-config-ir.workspace = true
getrandom.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "registry"] }
tracing-appender = { version = "0.2.5", optional = true }
syslog = { version = "7.0.0", optional = true }
opentelemetry = { version = "0.33.0", optional = true }
opentelemetry_sdk = { version = "0.33.0", optional = true, default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33.0", optional = true, default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
tracing-opentelemetry = { version = "0.34.0", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"
