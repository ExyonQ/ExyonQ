[package]
name = "exyonq-compat-nginx"
description = "NGINX config importer (Plan 09 Tier 1)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
exyonq-compat-common = { path = "../common" }
exyonq-config-ir = { path = "../../config/ir" }
