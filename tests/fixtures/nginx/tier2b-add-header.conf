# ADR-062 / F1-R19 — add_header → route.response_headers
server {
    listen 80;
    server_name headers.example;
    root /var/www;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff always;

    location / {
        index index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        add_header X-Api-Tag on;
    }
}
