worker_processes 1;
events { worker_connections 128; }
http {
    limit_req_zone $cookie_session zone=cookie:10m rate=10r/s;
    server {
        listen 80;
        server_name cookie.example;
        location / {
            limit_req zone=cookie burst=2 nodelay;
            proxy_pass http://127.0.0.1:9000;
        }
    }
}