# NG-18 / ADR-064 Phase E — slice in http/location + inheritance
worker_processes 1;
events { worker_connections 128; }

http {
    slice 1m;

    server {
        listen 18091;
        server_name slice.example;

        location / {
            proxy_pass http://127.0.0.1:9000;
        }

        location /off/ {
            slice 2m;
            proxy_pass http://127.0.0.1:9000;
        }
    }
}
