# NG-18 / ADR-064 Phase D — mirror in http/location + inheritance
worker_processes 1;
events { worker_connections 128; }

http {
    mirror /mirror;

    server {
        listen 18091;
        server_name mirror.example;

        location / {
            proxy_pass http://127.0.0.1:9000;
        }

        location /off/ {
            mirror /off-mirror;
            mirror_request_body off;
            proxy_pass http://127.0.0.1:9000;
        }

        location /disabled/ {
            mirror off;
            proxy_pass http://127.0.0.1:9000;
        }
    }
}
