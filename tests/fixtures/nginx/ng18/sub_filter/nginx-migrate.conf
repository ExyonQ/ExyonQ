# NG-18 / ADR-064 Phase C — sub_filter in http/location + inheritance
worker_processes 1;
events { worker_connections 128; }

http {
    sub_filter 'http://' 'https://';
    sub_filter_once off;
    sub_filter_types text/html;

    server {
        listen 18091;
        server_name sub.example;

        location / {
            proxy_pass http://127.0.0.1:9000;
        }

        location /off/ {
            sub_filter 'foo' 'bar';
            proxy_pass http://127.0.0.1:9000;
        }
    }
}
