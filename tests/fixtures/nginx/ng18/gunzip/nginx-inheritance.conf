# NG-18 / ADR-064 Phase A — gunzip inheritance (server on/off vs location)
worker_processes 1;
pid /tmp/nginx-ng18-inherit.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    access_log off;

    # server on; /off/ overrides off; / inherits on
    server {
        listen 18084;
        gunzip on;

        location / {
            proxy_pass http://__UPSTREAM__;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /off/ {
            gunzip off;
            rewrite ^/off/(.*)$ /$1 break;
            proxy_pass http://__UPSTREAM__;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # server off; /on/ overrides on; / inherits off
    server {
        listen 18085;
        gunzip off;

        location / {
            proxy_pass http://__UPSTREAM__;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /on/ {
            gunzip on;
            rewrite ^/on/(.*)$ /$1 break;
            proxy_pass http://__UPSTREAM__;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
