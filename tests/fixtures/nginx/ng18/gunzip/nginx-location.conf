# NG-18 / ADR-064 Phase A — gunzip at location scope
worker_processes 1;
pid /tmp/nginx-ng18-location.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    access_log off;

    server {
        listen 18083;

        location / {
            gunzip on;
            proxy_pass http://__UPSTREAM__;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
