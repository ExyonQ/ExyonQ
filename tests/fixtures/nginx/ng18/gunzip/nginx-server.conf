# NG-18 / ADR-064 Phase A — gunzip at server scope
worker_processes 1;
pid /tmp/nginx-ng18-server.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    access_log off;

    server {
        listen 18082;
        gunzip on;

        location / {
            proxy_pass http://__UPSTREAM__;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
