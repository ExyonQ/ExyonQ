# NG-18 / ADR-064 Phase A — gunzip at http scope
worker_processes 1;
pid /tmp/nginx-ng18-http.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    access_log off;
    gunzip on;
    gunzip_buffers 4 8k;

    server {
        listen 18081;
        location / {
            proxy_pass http://__UPSTREAM__;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
