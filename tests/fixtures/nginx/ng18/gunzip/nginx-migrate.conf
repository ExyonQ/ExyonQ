# NG-18 / ADR-064 — gunzip in http/server/location + inheritance
worker_processes 1;
pid /tmp/nginx-ng18-migrate.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    gunzip on;
    gunzip_buffers 4 8k;

    server {
        listen 18091;
        server_name a.example;

        location / {
            proxy_pass http://127.0.0.1:9000;
        }

        location /off/ {
            gunzip off;
            proxy_pass http://127.0.0.1:9000;
        }
    }

    server {
        listen 18092;
        server_name b.example;
        gunzip off;

        location / {
            proxy_pass http://127.0.0.1:9000;
        }

        location /on/ {
            gunzip on;
            proxy_pass http://127.0.0.1:9000;
        }
    }
}
