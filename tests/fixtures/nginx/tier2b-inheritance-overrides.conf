# NG-17 — explicit location directives override server inheritance
server {
    listen 80;
    server_name inherit.example;
    root /var/www;
    add_header X-Server yes;
    expires 30d;

    location /inherit/ {
        index index.html;
    }

    location /off/ {
        expires off;
    }

    location /denied/ {
        add_header Cache-Control "no-store";
    }
}
