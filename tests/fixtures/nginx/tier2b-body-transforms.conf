# NG-18 / ADR-064 — body transforms must fail closed, not disappear
server {
    listen 80;
    server_name body.example;
    root /var/www;
    gunzip on;
    sub_filter_once off;

    location / {
        sub_filter 'http://' 'https://';
        sub_filter_types text/html;
        slice 1m;
        mirror /mirror;
    }
}
