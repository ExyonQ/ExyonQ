# NG-17 — nginx expires + server-scope inheritance
server {
    listen 80;
    server_name expires.example;
    root /var/www;
    add_header X-Server yes;
    expires 30d;

    location /static/ {
        index index.html;
    }

    location /assets/ {
        expires 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        add_header X-Api yes;
        expires max;
    }
}
