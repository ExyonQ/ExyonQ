[package]
name = "exyonq-integration-tests"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false

[dev-dependencies]
bytes = "1"
exyonq-core = { path = "../../core", default-features = false, features = ["http3-provider-s2n", "test-utils"] }
exyonq-mod-proxy = { workspace = true }
exyonq-mod-static = { workspace = true }
exyonq-ops-runtime = { workspace = true }
exyonq-discovery-runtime = { workspace = true }
exyonq-reload-runtime = { workspace = true }
exyonq-acme = { workspace = true }
exyonq-metrics = { workspace = true }
exyonq-module-api = { path = "../../module-api" }
exyonq-config-ir = { workspace = true }
exyonq-wasm-host = { workspace = true }
exyonq-compat-common = { path = "../../compat/common" }
exyonq-compat-nginx = { path = "../../compat/nginx" }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }

[[test]]
name = "workspace_version"
path = "workspace_version.rs"

[[test]]
name = "spike_proxy"
path = "spike_proxy.rs"

[[test]]
name = "config_load"
path = "config_load.rs"

[[test]]
name = "server_health"
path = "server_health.rs"

[[test]]
name = "static_files"
path = "static_files.rs"

[[test]]
name = "proxy_config"
path = "proxy_config.rs"

[[test]]
name = "nginx_import"
path = "nginx_import.rs"

[[test]]
name = "modules"
path = "modules.rs"

[[test]]
name = "security"
path = "security.rs"

[[test]]
name = "wasm_host"
path = "wasm_host.rs"

[[test]]
name = "acme"
path = "acme.rs"
