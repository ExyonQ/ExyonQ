[package]
name = "exyonq-acme"
description = "ACME v2 certificate automation (HTTP-01) for ExyonQ"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
exyonq-config-ir = { workspace = true }
exyonq-module-api = { path = "../../module-api" }
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "ring", "time", "x509-parser"] }
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
rustls-pki-types = "1"
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
