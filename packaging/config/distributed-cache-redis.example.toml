# Optional L2 Redis distributed coordination (WC7D)
# Default: disabled. Dataplane readiness must NOT depend on Redis.

[full_page_cache]
enabled = false
namespace = 1

[full_page_cache.distributed_cache]
enabled = false
# provider unset/empty until explicitly opted in ("redis" or "local")
provider = ""
invalidation_enabled = false
generation_enabled = false
max_pending_events = 256
max_event_bytes = 8192
dedup_capacity = 1024
dedup_ttl_ms = 60000

[full_page_cache.distributed_cache.redis]
# Private network only — never expose Redis publicly.
endpoint = "redis://redis.internal:6379/"
connect_timeout_ms = 500
command_timeout_ms = 500
reconnect_min_backoff_ms = 100
reconnect_max_backoff_ms = 5000
namespace = "exyonq:fpc:v1:prod"
stream_maxlen = 10000

[full_page_cache.distributed_cache.security]
# Secrets via files only (no inline secret bytes in TOML).
active_key_id = "k1"
active_key_file = "/run/secrets/exyonq_l2_hmac_active"
# previous_key_id / previous_key_file — set during rotation overlap only
max_clock_skew_ms = 60000
replay_window_ms = 300000
