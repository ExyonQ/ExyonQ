; ExyonQ WordPress pool. Replaces Wolfi's default www.conf (127.0.0.1:9000,
; user nobody) and zz-apko.conf is removed in the Dockerfile so this file is the
; single source of truth for the listen socket and the worker user.
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = www-data
group = www-data
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
clear_env = no
catch_workers_output = yes
