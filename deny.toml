[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
unmaintained = "workspace"
# RUSTSEC-2025-0134 ignore removed after P14V042 rustls-pemfile → rustls-pki-types migration.
# RUSTSEC-2026-0222 waiver removed in D11 after wasmtime 45.0.2 → 46.0.2 (patched range >=46.0.2,<47.0.0).
ignore = []

# License allow-list — keep aligned with scripts/legal/about.toml `accepted`.
[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "OpenSSL",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  # BSL-1.0: permissive, OSI-approved, no copyleft (redis → xxhash-rust).
  "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
