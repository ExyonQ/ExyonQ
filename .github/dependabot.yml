# Dependabot version updates — https://docs.github.com/en/code-security/dependabot
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    # One PR per group. Each cargo PR rewrites Cargo.lock, so five independent
    # bumps collide with each other and have to be re-resolved by hand after
    # every merge (`fix(deps): re-resolve the lock after the dependency merges`).
    # Majors stay separate on purpose: they need their own review.
    groups:
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    # Action bumps are independent of Cargo.lock and safe in one PR.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: deps
      include: scope
