name: Wasmtime weekly watch

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  wasmtime-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (pin; preserves toolchain input contract)
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: wasmtime watch report
        run: bash scripts/deps/wasmtime-watch.sh
      - name: cargo audit (signal)
        run: cargo install cargo-audit --locked && cargo audit || true
