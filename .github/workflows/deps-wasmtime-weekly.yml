name: Wasmtime weekly watch

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  wasmtime-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin; preserves toolchain input contract)
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: wasmtime watch report
        run: bash scripts/deps/wasmtime-watch.sh
      - name: cargo audit (signal)
        run: cargo install cargo-audit --locked && cargo audit || true
