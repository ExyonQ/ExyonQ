name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Skip dependabot PRs — they only bump deps, audited separately
    paths-ignore:
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always
  # Allow dead_code for env-gated epoll/io_uring paths (EXYONQ_EPOLL_*) that
  # compile on Linux but are only reachable via runtime flags, matching ci.yml.
  RUSTFLAGS: -Dwarnings -Adead_code

jobs:
  legal-compliance:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (pin; preserves toolchain input contract)
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Cache cargo tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin
          key: cargo-tools-deny-about-${{ runner.os }}
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.0 --features cli
      - name: Verify legal bundle (licenses + notices)
        run: bash scripts/legal/verify-release-legal-bundle.sh

  deps-audit:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (pin; preserves toolchain input contract)
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Cache cargo tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin
          key: cargo-tools-audit-${{ runner.os }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: cargo audit
        run: cargo audit

  deps-deny-advisories:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (pin; preserves toolchain input contract)
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Cache cargo tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin
          key: cargo-tools-deny-${{ runner.os }}
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: cargo deny check advisories bans sources
        run: cargo deny check advisories bans sources

  security-tests:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (pin; preserves toolchain input contract)
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: install nextest
        uses: taiki-e/install-action@599db1c4ae1189bda3d02a890b7ede4888c9d8f5 # nextest
      - name: security integration tests
        run: cargo nextest run -p exyonq-integration-tests --filter-expr 'test(security) or test(wasm_host)' --test-threads=1

  private-material:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history gate must inspect every reachable commit, not a shallow tip.
          fetch-depth: 0
      - name: private-material-zero (publication set)
        run: bash scripts/security/scan-private-material.sh --publication --repo .
      - name: private-material-zero selftest
        run: bash scripts/security/scan-private-material.sh --selftest
      - name: private-material-zero (reachable history)
        run: bash scripts/security/scan-private-material.sh --history --repo .
      - name: publication path guard
        run: bash scripts/security/tests/test-publication-path-guard.sh
      - name: publication hooks clean-worktree regression
        run: bash scripts/security/tests/test-publication-hooks.sh

  integrity-gates:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: project-integrity selftest + tree
        run: |
          bash scripts/gates/project-integrity-gate.sh --selftest
          bash scripts/gates/project-integrity-gate.sh --tree .
      - name: benchmark-integrity selftest + tree
        run: |
          bash scripts/gates/benchmark-integrity-gate.sh --selftest
          bash scripts/gates/benchmark-integrity-gate.sh --tree .
      - name: data-provenance selftest
        run: bash scripts/gates/data-provenance-gate.sh --selftest
      - name: unsafe-allowlist selftest + tree (ADR-045)
        run: |
          bash scripts/gates/unsafe-allowlist-gate.sh --selftest
          bash scripts/gates/unsafe-allowlist-gate.sh --tree .
      - name: publication-privacy selftest + release material (rule 135)
        run: |
          bash scripts/gates/publication-privacy-gate.sh --selftest
          bash scripts/gates/publication-privacy-gate.sh
      - name: real-evidence selftest + changed report/evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/gates/real-evidence-gate.sh --selftest
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            bash scripts/gates/real-evidence-gate.sh --diff HEAD^
          else
            bash scripts/gates/real-evidence-gate.sh --diff "${BASE_SHA}...HEAD"
          fi
      - name: release-audit infra selftest
        run: |
          bash scripts/verify-release-audit.sh --dry-run-infra
          bash scripts/verify-release-audit.sh --selftest
      - name: waiver register
        run: bash scripts/gates/waiver-expiry-gate.sh --check

  functional-security-check:

    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (pin; preserves toolchain input contract)
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: functional security check
        run: bash scripts/security-functional-check.sh
