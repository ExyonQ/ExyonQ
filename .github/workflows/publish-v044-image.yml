name: Publish v0.4.4 image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.4.4
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ExyonQ
          password: ${{ secrets.EXYONQ_GHCR_TOKEN }}
      - name: Confirm the registry accepts this token
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          printf 'FROM scratch\nLABEL org.opencontainers.image.source=https://github.com/ExyonQ/ExyonQ\n' > "$dir/Dockerfile"
          docker buildx build --push --provenance=false --sbom=false \
            -t ghcr.io/exyonq/exyonq:acl-probe \
            "$dir"
      - name: Resolve tagged revision
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            EXYONQ_VERSION=0.4.4
            EXYONQ_GIT_REVISION=${{ steps.rev.outputs.sha }}
            EXYONQ_OFFICIAL_RELEASE=1
          labels: |
            org.opencontainers.image.title=ExyonQ
            org.opencontainers.image.version=0.4.4
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.source=https://github.com/ExyonQ/ExyonQ
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            ghcr.io/exyonq/exyonq:0.4.4
