name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  security-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin; preserves toolchain input contract)
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli
      - uses: taiki-e/install-action@599db1c4ae1189bda3d02a890b7ede4888c9d8f5 # nextest
      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          # P14SIGN Phase 2: fail-closed — no legacy/untagged fallback
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "ERROR: official release requires refs/tags/v*; untagged fallback FORBIDDEN" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ -z "$VERSION" ]]; then
            echo "ERROR: empty version derived from tag" >&2
            exit 1
          fi
          if [[ "$VERSION" =~ ^0\.(1|2|3)([.-]|$) ]]; then
            echo "ERROR: legacy version forbidden: $VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: cargo audit
        run: cargo audit
      - name: Verify release legal bundle
        run: bash scripts/legal/verify-release-legal-bundle.sh
      - name: cargo deny check advisories bans sources
        run: cargo deny check advisories bans sources
      - name: security tests
        run: cargo nextest run -p exyonq-integration-tests --filter-expr 'test(security)' --test-threads=1
      - name: verify release audit
        run: bash scripts/verify-release-audit.sh "${{ steps.ver.outputs.version }}"

  compliance-artifacts:
    needs: security-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin; preserves toolchain input contract)
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate release compliance artifacts
        shell: bash
        run: bash scripts/legal/generate-release-compliance-artifacts.sh
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-compliance
          path: |
            THIRD_PARTY_NOTICES.md
            sbom.cdx.json

  build:
    name: ${{ matrix.target }}
    needs: compliance-artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: exyonq-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: exyonq-linux-arm64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: exyonq-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: exyonq-windows-amd64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-compliance
          path: .
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin; preserves toolchain input contract)
        with:
          toolchain: 1.93.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Build binaries (unix)
        if: runner.os != 'Windows'
        # P1.5-WS6: --locked required for release artifacts.
        run: cargo build --release --locked -p exyonq -p exyonqctl -p exyonq-compat-cli --target ${{ matrix.target }}
      - name: Build binaries (windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p exyonq --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "ERROR: official release requires refs/tags/v*; untagged fallback FORBIDDEN" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF" ]]; then
            echo "ERROR: empty/invalid version from tag" >&2
            exit 1
          fi
          if [[ "$VERSION" =~ ^0\.(1|2|3)([.-]|$) ]]; then
            echo "ERROR: legacy version forbidden: $VERSION" >&2
            exit 1
          fi
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) ARCH_LABEL=amd64 ;;
            aarch64-unknown-linux-gnu) ARCH_LABEL=arm64 ;;
            aarch64-apple-darwin) ARCH_LABEL=arm64 ;;
            *) ARCH_LABEL=unknown ;;
          esac
          cp target/${{ matrix.target }}/release/exyonq dist/
          cp target/${{ matrix.target }}/release/exyonqctl dist/
          cp target/${{ matrix.target }}/release/exyonq-compat dist/
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md sbom.cdx.json dist/
          # Legacy flat tarball (compat CLI + legal) — retained for historical consumers.
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist \
            exyonq exyonqctl exyonq-compat LICENSE NOTICE THIRD_PARTY_NOTICES.md sbom.cdx.json
          # WS6 product layout for Linux GNU (versioned) — matches p15-ws6-build-artifacts staging.
          if [[ "${{ matrix.target }}" == *-unknown-linux-gnu ]]; then
            STAGE="$(mktemp -d)"
            mkdir -p "$STAGE/usr/bin" "$STAGE/etc/exyonq" \
              "$STAGE/usr/lib/systemd/system" "$STAGE/usr/lib/tmpfiles.d" \
              "$STAGE/etc/logrotate.d" "$STAGE/usr/share/doc/exyonq" \
              "$STAGE/usr/share/licenses/exyonq"
            install -m 0755 dist/exyonq dist/exyonqctl "$STAGE/usr/bin/"
            install -m 0644 packaging/config/config.toml.example "$STAGE/etc/exyonq/"
            install -m 0644 packaging/systemd/exyonq.service "$STAGE/usr/lib/systemd/system/"
            install -m 0644 packaging/tmpfiles.d/exyonq.conf "$STAGE/usr/lib/tmpfiles.d/" || true
            install -m 0644 packaging/logrotate.d/exyonq "$STAGE/etc/logrotate.d/" || true
            install -m 0644 packaging/README.md "$STAGE/usr/share/doc/exyonq/README.md" || true
            install -m 0644 LICENSE NOTICE "$STAGE/usr/share/licenses/exyonq/" || true
            printf 'version=%s\ntarget=%s\nprofile=release\ncargo_locked=true\n' \
              "$VERSION" "${{ matrix.target }}" >"$STAGE/build-manifest.txt"
            printf '{"version":"%s","target":"%s","cargo_locked":true}\n' \
              "$VERSION" "${{ matrix.target }}" >"$STAGE/build-manifest.json"
            tar -C "$STAGE" -czf "dist/exyonq-${VERSION}-linux-${ARCH_LABEL}.tar.gz" \
              usr etc build-manifest.json build-manifest.txt
            rm -rf "$STAGE"
          fi
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/exyonq.exe dist/exyonq.exe
          Copy-Item target/${{ matrix.target }}/release/exyonqctl.exe dist/exyonqctl.exe -ErrorAction SilentlyContinue
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_NOTICES.md, sbom.cdx.json dist/
          Compress-Archive -Path dist/exyonq.exe, dist/LICENSE, dist/NOTICE, dist/THIRD_PARTY_NOTICES.md, dist/sbom.cdx.json -DestinationPath dist/${{ matrix.artifact }}.zip -Force
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.*
            dist/exyonq-*-linux-*.tar.gz
            dist/SHA256SUMS.txt
            dist/build-manifest.json
            dist/build-manifest.txt
          if-no-files-found: warn

  package-linux:
    name: package deb/rpm amd64
    needs: [build, compliance-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-compliance
          path: .
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: exyonq-linux-amd64
          path: dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
      - name: Install nfpm (pinned — no @latest; P1.5-WS6 NFPM_PIN)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Build .deb and .rpm
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "ERROR: official release requires refs/tags/v*; untagged fallback FORBIDDEN" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF" ]]; then
            echo "ERROR: empty/invalid version from tag" >&2
            exit 1
          fi
          if [[ "$VERSION" =~ ^0\.(1|2|3)([.-]|$) ]]; then
            echo "ERROR: legacy version forbidden: $VERSION" >&2
            exit 1
          fi
          export VERSION ARCH=amd64
          tar -xzf dist/exyonq-linux-amd64.tar.gz -C dist
          ls -la dist/
          nfpm pkg --config packaging/nfpm.yaml --packager deb --target dist/
          nfpm pkg --config packaging/nfpm.yaml --packager rpm --target dist/
          ls -la dist/*.{deb,rpm}
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: exyonq-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm

  checksums:
    needs: [build, package-linux]
    runs-on: ubuntu-latest
    steps:
      # P14SIGN Phase 3 / Option A cutover:
      # ROOT_SIGNED_OBJECT = SHA256SUMS.txt
      # RELEASE_MANIFEST_INCLUDED_IN_SHA256SUMS = YES
      # ARTIFACTS_INCLUDED_IN_SHA256SUMS = YES
      # Cosign sign-blob / OCI sign steps intentionally NOT wired (no secrets, no production keys).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: exyonq-*
          path: download
          merge-multiple: true
      - name: Resolve version for Option A manifest
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "ERROR: official release requires refs/tags/v*; untagged fallback FORBIDDEN" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ -z "$VERSION" ]]; then
            echo "ERROR: empty version derived from tag" >&2
            exit 1
          fi
          if [[ "$VERSION" =~ ^0\.(1|2|3)([.-]|$) ]]; then
            echo "ERROR: legacy version forbidden: $VERSION" >&2
            exit 1
          fi
          if [[ "$VERSION" == "latest" ]]; then
            echo "ERROR: latest forbidden as version identity" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build Option A unsigned bundle (manifest then SHA256SUMS)
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          COMMIT="$(printf '%s' "${GITHUB_SHA}" | tr 'A-F' 'a-f')"
          mkdir -p bundle/artifacts
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            cp -n "$f" "bundle/artifacts/${base}"
          done < <(find download -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) -print0 | sort -z)
          deb_n="$(find bundle/artifacts -type f -name '*.deb' | wc -l | tr -d ' ')"
          rpm_n="$(find bundle/artifacts -type f -name '*.rpm' | wc -l | tr -d ' ')"
          if [[ "$deb_n" -lt 1 || "$rpm_n" -lt 1 ]]; then
            echo "ERROR: expected >=1 .deb and >=1 .rpm from package-linux (deb=${deb_n} rpm=${rpm_n})" >&2
            find download -type f | head -50 >&2 || true
            exit 1
          fi
          art_n="$(find bundle/artifacts -type f | wc -l | tr -d ' ')"
          if [[ "$art_n" -lt 1 ]]; then
            echo "ERROR: no release artifacts assembled under bundle/artifacts" >&2
            exit 1
          fi
          bash scripts/release/generate-release-manifest.sh \
            --version "$VERSION" \
            --git-commit "$COMMIT" \
            --artifacts-dir bundle/artifacts \
            --output bundle/release-manifest.json \
            --force
          bash scripts/release/generate-checksums.sh \
            --bundle-root bundle \
            --output bundle/SHA256SUMS.txt \
            --force
          bash scripts/release/verify-checksums.sh --bundle-root bundle
          # Fail-closed: manifest + every artifact must appear in SHA256SUMS.
          grep -F "  release-manifest.json" bundle/SHA256SUMS.txt >/dev/null || {
            echo "ERROR: release-manifest.json missing from SHA256SUMS.txt" >&2
            exit 1
          }
          while IFS= read -r f; do
            rel="artifacts/$(basename "$f")"
            grep -F "  ${rel}" bundle/SHA256SUMS.txt >/dev/null || {
              echo "ERROR: missing checksum for ${rel}" >&2
              exit 1
            }
          done < <(find bundle/artifacts -type f)
          # Forbidden legacy checksum sidecar.
          if [[ -e bundle/build-manifest.json ]]; then
            echo "ERROR: legacy build-manifest.json must not be produced" >&2
            exit 1
          fi
          echo "P14SIGN_CI_OPTION_A_CUTOVER=PASS"
          echo "ROOT_SIGNED_OBJECT=SHA256SUMS.txt"
          echo "RELEASE_MANIFEST_INCLUDED_IN_SHA256SUMS=YES"
          echo "ARTIFACTS_INCLUDED_IN_SHA256SUMS=YES"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: checksums
          path: |
            bundle/SHA256SUMS.txt
            bundle/release-manifest.json
            bundle/artifacts/*
  docker:
    needs: compliance-artifacts
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-compliance
          path: .
      - name: Set version
        id: ver
        run: |
          set -euo pipefail
          # P14SIGN Phase 2: fail-closed — no legacy/untagged fallback
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "ERROR: official release requires refs/tags/v*; untagged fallback FORBIDDEN" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ -z "$VERSION" ]]; then
            echo "ERROR: empty version derived from tag" >&2
            exit 1
          fi
          if [[ "$VERSION" =~ ^0\.(1|2|3)([.-]|$) ]]; then
            echo "ERROR: legacy version forbidden: $VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: true
          # P14V042: inject tag commit into binary + OCI label; fail closed without real SHA.
          # Do not copy .git into the build context (.dockerignore remains authoritative).
          build-args: |
            EXYONQ_VERSION=${{ steps.ver.outputs.version }}
            EXYONQ_GIT_REVISION=${{ github.sha }}
            EXYONQ_OFFICIAL_RELEASE=1
          # P14SIGN: digest is the release identity; do not publish :latest or legacy :v0.3 aliases.
          tags: |
            ghcr.io/exyonq/exyonq:${{ steps.ver.outputs.version }}

  github-release:
    needs: [security-release, build, checksums, package-linux, docker, compliance-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          # P14SIGN Phase 2: fail-closed — no legacy/untagged fallback
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "ERROR: official release requires refs/tags/v*; untagged fallback FORBIDDEN" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ -z "$VERSION" || -z "$TAG" ]]; then
            echo "ERROR: empty version/tag derived from ref" >&2
            exit 1
          fi
          if [[ "$VERSION" =~ ^0\.(1|2|3)([.-]|$) ]]; then
            echo "ERROR: legacy version forbidden: $VERSION" >&2
            exit 1
          fi
          if [[ "$TAG" != "v${VERSION}" ]]; then
            echo "ERROR: tag/version mismatch: $TAG vs v${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-compliance
          path: compliance
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: exyonq-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: checksums
          path: artifacts
      - name: Flatten release assets (Option A layout)
        run: |
          set -euo pipefail
          mkdir -p release-assets/artifacts
          # Prefer Option A checksums artifact layout when present.
          if [[ -f artifacts/SHA256SUMS.txt ]]; then
            cp artifacts/SHA256SUMS.txt release-assets/
          else
            find artifacts -type f -name 'SHA256SUMS.txt' -exec cp {} release-assets/ \;
          fi
          if [[ -f artifacts/release-manifest.json ]]; then
            cp artifacts/release-manifest.json release-assets/
          else
            find artifacts -type f -name 'release-manifest.json' -exec cp {} release-assets/ \;
          fi
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              SHA256SUMS.txt|release-manifest.json|build-manifest.json) continue ;;
            esac
            cp -n "$f" "release-assets/artifacts/${base}"
          done < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) -print0)
          cp compliance/THIRD_PARTY_NOTICES.md compliance/sbom.cdx.json release-assets/
          ls -laR release-assets/
          [[ -f release-assets/SHA256SUMS.txt ]] || {
            echo "ERROR: missing SHA256SUMS.txt" >&2
            exit 1
          }
          [[ -f release-assets/release-manifest.json ]] || {
            echo "ERROR: missing release-manifest.json (Option A)" >&2
            exit 1
          }
          if [[ -e release-assets/build-manifest.json ]]; then
            echo "ERROR: legacy build-manifest.json must not be published" >&2
            exit 1
          fi
          # Option A: SUMS must list release-manifest.json and artifacts/ paths.
          grep -F "  release-manifest.json" release-assets/SHA256SUMS.txt >/dev/null || {
            echo "ERROR: SHA256SUMS.txt missing release-manifest.json entry" >&2
            exit 1
          }
          if ! grep -E '  artifacts/' release-assets/SHA256SUMS.txt >/dev/null; then
            echo "ERROR: SHA256SUMS.txt missing artifacts/ entries (Option A)" >&2
            cat release-assets/SHA256SUMS.txt >&2
            exit 1
          fi
          bash scripts/release/verify-checksums.sh --bundle-root release-assets || {
            echo "ERROR: Option A verify-checksums failed on release-assets" >&2
            exit 1
          }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ExyonQ v${{ steps.ver.outputs.version }}
          body_path: docs/release/v${{ steps.ver.outputs.version }}.md
          files: |
            release-assets/SHA256SUMS.txt
            release-assets/release-manifest.json
            release-assets/THIRD_PARTY_NOTICES.md
            release-assets/sbom.cdx.json
            release-assets/artifacts/*
          fail_on_unmatched_files: true
