[package]
name = "exyonq-wasm-host"
description = "Wasmtime host for ExyonQ L4 plugins (v0.4 prep)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dashmap.workspace = true
thiserror.workspace = true
wasmtime.workspace = true
# Pin to the wasm-tools line compatible with wasmtime 49 (Dependabot #40).
wat = "=1.261.0"
# crypto-common 0.1.7 pins generic-array = "=0.14.7" so dependents never see the
# 0.14.8+ deprecation warning (Dependabot #43). Direct pin keeps the digest 0.10
# stack on the exact 0.14.7 line.

[dev-dependencies]
wat = "=1.261.0"
criterion = "0.8"

[[bench]]
name = "invoke_latency"
harness = false
